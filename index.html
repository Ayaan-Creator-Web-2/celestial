<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial V2</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168bff;
    --red: #ff254d;
    --white: #f5f7ff;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030408;
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 50% 60%,
            #101827 0%,
            #080b12 38%,
            #030408 78%);
    transition: opacity .7s ease, transform .7s ease;
}

.screen.hidden {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
}

.screen.leaving {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
}

/* =========================
   SCREEN 1: LOADING
========================= */

#loadingScreen {
    z-index: 2;
}

.streak {
    position: absolute;
    left: -120%;
    width: 140%;
    height: 2px;
    opacity: 0;
    transform: rotate(-12deg);
    pointer-events: none;
}

.streak.blue {
    top: 35%;
    background: linear-gradient(
        90deg, transparent, var(--blue), #d7edff, transparent
    );
    box-shadow: 0 0 20px var(--blue);
    animation: streakBlue 1.1s ease-out .3s forwards;
}

.streak.red {
    top: 66%;
    background: linear-gradient(
        90deg, transparent, var(--red), #ffd1da, transparent
    );
    box-shadow: 0 0 20px var(--red);
    animation: streakRed 1.1s ease-out .7s forwards;
}

@keyframes streakBlue {
    0% { left: -120%; opacity: 0; }
    15% { opacity: 1; }
    100% { left: 120%; opacity: 0; }
}

@keyframes streakRed {
    0% { left: -120%; opacity: 0; }
    15% { opacity: 1; }
    100% { left: 120%; opacity: 0; }
}

.loading-content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 24px;
    text-align: center;
}

.eyebrow {
    color: #8d9ab0;
    font-size: 10px;
    letter-spacing: 7px;
    text-transform: uppercase;
    animation: fadeUp .7s ease .3s both;
}

.loading-title {
    margin: 24px 0 18px;
    font-size: clamp(42px, 10vw, 112px);
    font-weight: 900;
    letter-spacing: clamp(2px, 1vw, 12px);
    line-height: .95;
    opacity: 0;
    animation: titleReveal 1s cubic-bezier(.16,1,.3,1) .5s forwards;
}

.gradient-text {
    color: transparent;
    background: linear-gradient(
        100deg,
        #f6f8ff 5%,
        #c5d9ff 35%,
        #429eff 56%,
        #ff365b 85%
    );
    background-clip: text;
    -webkit-background-clip: text;
}

@keyframes titleReveal {
    from {
        opacity: 0;
        transform: scaleX(1.12) translateY(18px);
        filter: blur(12px);
    }
    to {
        opacity: 1;
        transform: scaleX(1) translateY(0);
        filter: blur(0);
    }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.loading-subtitle {
    color: #7d899f;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: fadeUp .7s ease 1s both;
}

.boot {
    width: min(300px, 75vw);
    margin: 44px auto 0;
    text-align: left;
    animation: fadeUp .5s ease 1.2s both;
}

.boot-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: #7c8ca7;
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 2px;
}

.status {
    color: #8bbcff;
}

.bar {
    width: 100%;
    height: 2px;
    background: #18202d;
}

.bar-fill {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--blue), #d5eaff, var(--red));
    box-shadow: 0 0 12px #328bff;
}

.loading-footer {
    position: absolute;
    bottom: 25px;
    left: 28px;
    right: 28px;
    display: flex;
    justify-content: space-between;
    color: #4f5b70;
    font: 9px monospace;
    letter-spacing: 1px;
}

/* =========================
   SCREEN 2: INTRO
========================= */

#introScreen {
    z-index: 1;
    background:
        radial-gradient(ellipse at 50% 50%,
            #111b2b 0%,
            #070a11 43%,
            #030408 80%);
}

.intro-content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 24px;
    text-align: center;
}

.intro-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 13px;
    border: 1px solid #273348;
    background: #0c111b;
    color: #a9bad3;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
}

.intro-tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #49a4ff;
    box-shadow: 0 0 10px #168bff;
}

.intro-title {
    margin: 30px 0 18px;
    font-size: clamp(44px, 10vw, 116px);
    font-weight: 900;
    line-height: .95;
    letter-spacing: clamp(1px, .8vw, 9px);
    opacity: 0;
}

.intro-title .line {
    display: block;
}

.intro-title .second-line {
    margin-top: 8px;
    color: transparent;
    background: linear-gradient(90deg, #fff, #91bfff, #ff5270);
    background-clip: text;
    -webkit-background-clip: text;
}

.intro-description {
    max-width: 460px;
    margin: 25px auto 0;
    color: #8995a9;
    font-size: 14px;
    line-height: 1.9;
    opacity: 0;
}

.enter-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin-top: 36px;
    padding: 17px 23px;
    border: 1px solid #edf4ff;
    background: #edf4ff;
    color: #080b12;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    opacity: 0;
    transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        transform .25s ease;
}

.enter-button span {
    font-size: 17px;
    transition: transform .25s ease;
}

.enter-button:hover {
    color: white;
    background: #101a2a;
    border-color: var(--blue);
    transform: translateY(-3px);
}

.enter-button:hover span {
    transform: translateX(5px);
}

.intro-bottom {
    position: absolute;
    bottom: 26px;
    left: 28px;
    right: 28px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: #4f5b70;
    font: 9px monospace;
    letter-spacing: 1px;
    opacity: 0;
}

/* Decorative edge lines */

.edge {
    position: absolute;
    width: 1px;
    height: 0;
    background: linear-gradient(transparent, #168bff, transparent);
    opacity: .65;
}

.edge.left {
    left: 8%;
    top: 20%;
    animation: edgeGrow 1.1s ease .4s forwards;
}

.edge.right {
    right: 8%;
    bottom: 20%;
    background: linear-gradient(transparent, #ff254d, transparent);
    animation: edgeGrow 1.1s ease .6s forwards;
}

@keyframes edgeGrow {
    to { height: 60%; }
}

/* Intro entrance animations */

#introScreen.play .intro-tag {
    animation: fadeUp .7s ease .2s forwards;
}

#introScreen.play .intro-title {
    animation: titleReveal .9s cubic-bezier(.16,1,.3,1) .45s forwards;
}

#introScreen.play .intro-description {
    animation: fadeUp .7s ease .8s forwards;
}

#introScreen.play .enter-button {
    animation: fadeUp .7s ease 1.05s forwards;
}

#introScreen.play .intro-bottom {
    animation: fadeUp .7s ease .8s forwards;
}

/* Screen transition flash */

.flash {
    position: fixed;
    z-index: 10;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}

.flash.fire {
    animation: flashOut .55s ease forwards;
}

@keyframes flashOut {
    0% { opacity: 0; }
    20% { opacity: .75; }
    100% { opacity: 0; }
}

@media (max-width: 480px) {
    .eyebrow { letter-spacing: 4px; }
    .loading-subtitle { letter-spacing: 2px; }
    .intro-description { font-size: 13px; }
    .loading-footer, .intro-bottom {
        left: 15px;
        right: 15px;
        font-size: 8px;
    }
    .edge.left { left: 4%; }
    .edge.right { right: 4%; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<!-- SCREEN 1: LOADING -->

<section class="screen" id="loadingScreen">
    <div class="streak blue"></div>
    <div class="streak red"></div>

    <div class="loading-content">
        <p class="eyebrow">A new experience begins</p>

        <h1 class="loading-title">
            <span class="gradient-text">CELESTIAL</span>
        </h1>

        <p class="loading-subtitle">
            Version 2.0 · Beyond the ordinary
        </p>

        <div class="boot">
            <div class="boot-top">
                <span id="bootText">INITIALIZING SYSTEM</span>
                <span class="status" id="percentage">00%</span>
            </div>
            <div class="bar">
                <div class="bar-fill" id="barFill"></div>
            </div>
        </div>
    </div>

    <div class="loading-footer">
        <span>CL / SYSTEM ONLINE</span>
        <span>BUILT FOR WHAT'S NEXT</span>
    </div>
</section>

<!-- SCREEN 2: SEPARATE INTRO -->

<section class="screen hidden" id="introScreen">
    <div class="edge left"></div>
    <div class="edge right"></div>

    <div class="intro-content">
        <div class="intro-tag">WELCOME TO THE NEXT ERA</div>

        <h2 class="intro-title">
            <span class="line">THIS IS</span>
            <span class="line second-line">CELESTIAL.</span>
        </h2>

        <p class="intro-description">
            Your gateway to games, entertainment and more.
            <br>
            Everything you want. One place.
        </p>

        <button class="enter-button" id="enterButton">
            ENTER CELESTIAL
            <span>↗</span>
        </button>
    </div>

    <div class="intro-bottom">
        <span>CELESTIAL V2.0</span>
        <span>YOUR WORLD STARTS HERE</span>
    </div>
</section>

<div class="flash" id="flash"></div>

<script>
const loadingScreen = document.getElementById("loadingScreen");
const introScreen = document.getElementById("introScreen");
const percentage = document.getElementById("percentage");
const bootText = document.getElementById("bootText");
const barFill = document.getElementById("barFill");
const enterButton = document.getElementById("enterButton");
const flash = document.getElementById("flash");

const destination =
    "https://sites.google.com/view/celestial-2/home";

const loadingDuration = 4200;

let startedAt = null;
let loadingComplete = false;
let entering = false;

function showIntro() {
    if (loadingComplete) return;
    loadingComplete = true;

    percentage.textContent = "100%";
    barFill.style.width = "100%";
    bootText.textContent = "SYSTEM READY";

    loadingScreen.classList.add("leaving");

    setTimeout(() => {
        loadingScreen.classList.add("hidden");
        loadingScreen.classList.remove("leaving");

        introScreen.classList.remove("hidden");
        introScreen.classList.add("play");
    }, 700);
}

function updateLoading(timestamp) {
    if (loadingComplete) return;

    if (startedAt === null) {
        startedAt = timestamp;
    }

    const elapsed = timestamp - startedAt;
    const progress = Math.min(elapsed / loadingDuration, 1);
    const percent = Math.floor(progress * 100);

    percentage.textContent =
        String(percent).padStart(2, "0") + "%";

    barFill.style.width = percent + "%";

    if (percent < 25) {
        bootText.textContent = "INITIALIZING SYSTEM";
    } else if (percent < 55) {
        bootText.textContent = "LOADING INTERFACE";
    } else if (percent < 85) {
        bootText.textContent = "SYNCHRONIZING MODULES";
    } else {
        bootText.textContent = "PREPARING CELESTIAL";
    }

    if (progress >= 1) {
        showIntro();
        return;
    }

    requestAnimationFrame(updateLoading);
}

enterButton.addEventListener("click", () => {
    if (entering) return;
    entering = true;

    flash.classList.add("fire");
    introScreen.classList.add("leaving");

    setTimeout(() => {
        window.location.href = destination;
    }, 550);
});

requestAnimationFrame(updateLoading);
</script>

</body>
</html>
